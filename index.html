<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>May the 4th 💌</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  min-height: 100vh;
  background: #0f0c1a;
  font-family: 'Nunito', sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}

#scene {
  position: relative;
  z-index: 10;
  width: 340px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* envelope stage */
#env-stage {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: transform 0.15s;
}
#env-stage:active { transform: scale(0.96); }

.tap-label {
  font-family: 'Caveat', cursive;
  font-size: 21px;
  color: #c8aaee;
  animation: bob 2s ease-in-out infinite;
}
@keyframes bob {
  0%,100% { transform: translateY(0); opacity:0.85; }
  50%      { transform: translateY(-6px); opacity:1; }
}

/* card */
#card {
  display: none;
  flex-direction: column;
  align-items: center;
  width: 100%;
}

#jedi-wrap {
  position: relative;
  z-index: 5;
  margin-bottom: -28px;
  opacity: 0;
  transform: translateY(28px) scale(0.75);
  transition: all 0.55s cubic-bezier(0.34,1.56,0.64,1);
}
#jedi-wrap.show { opacity:1; transform: translateY(0) scale(1); }

#jedi-img {
  width: 240px; height: 240px;
  border-radius: 8px;
  object-fit: contain;
  border: 3px solid #e8d5ff;
  box-shadow: 0 0 0 3px #0f0c1a, 0 0 0 6px #9b72cc;
  display: block;
  background: radial-gradient(circle at 40% 38%, #261848, #100c24);
}
#jedi-fallback {
  width: 240px; height: 240px;
  border-radius: 8px;
  background: radial-gradient(circle at 40% 38%, #261848, #100c24);
  border: 3px solid #e8d5ff;
  box-shadow: 0 0 0 3px #0f0c1a, 0 0 0 6px #9b72cc;
  display: none;
  align-items: center;
  justify-content: center;
  font-size: 46px;
}

#paper {
  background: #1c1430;
  border-radius: 20px;
  border: 2px dashed #5a3a8a;
  padding: 40px 22px 26px;
  width: 100%;
  opacity: 0;
  transform: translateY(14px);
  transition: all 0.5s 0.2s ease;
}
#paper.show { opacity:1; transform: translateY(0); }

.line {
  text-align: center;
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 0.45s, transform 0.45s;
}
.line.show { opacity:1; transform: translateY(0); }

.l-name {
  font-family: 'Caveat', cursive;
  font-size: 27px;
  font-weight: 700;
  color: #f5df8e;
  margin-bottom: 10px;
}
.l-body {
  font-size: 14px;
  color: #c0aad8;
  line-height: 1.65;
  margin-bottom: 18px;
}
.l-q {
  font-family: 'Caveat', cursive;
  font-size: 25px;
  font-weight: 700;
  color: #f0a0c0;
  line-height: 1.4;
  margin-bottom: 22px;
}

#btns {
  display: flex;
  gap: 10px;
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 0.4s, transform 0.4s;
}
#btns.show { opacity:1; transform:translateY(0); }

.btn {
  flex:1;
  padding: 12px 8px;
  border-radius: 50px;
  border: 2px solid;
  font-family: 'Caveat', cursive;
  font-size: 19px;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.12s;
  -webkit-tap-highlight-color: transparent;
}
.btn:active { transform: scale(0.93); }
.btn-yes  { background:#7b2250; border-color:#f0a0c0; color:#ffe0ee; }
.btn-sure { background:#201540; border-color:#7a5aaa; color:#c8aaee; }

/* floating sparkles */
.sp {
  position: fixed;
  pointer-events: none;
  z-index: 100;
  animation: rise var(--d,2.5s) ease-out forwards;
  font-family: 'Nunito', sans-serif;
}
@keyframes rise {
  0%   { opacity:1; transform: translateY(0) scale(1); }
  100% { opacity:0; transform: translateY(-200px) scale(0.4); }
}

/* celebration */
#cel {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 200;
  background: rgba(8,5,18,0.9);
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 16px;
  padding: 32px;
}
#cel.show { display:flex; }

.cel-title {
  font-family: 'Caveat', cursive;
  font-size: 28px;
  font-weight: 700;
  color: #f5df8e;
  text-align: center;
  animation: pop 0.4s cubic-bezier(0.34,1.56,0.64,1) both;
}
.cel-msg {
  font-size: 14px;
  color: #c0aad8;
  text-align: center;
  line-height: 1.65;
  animation: pop 0.4s 0.15s cubic-bezier(0.34,1.56,0.64,1) both;
}
@keyframes pop {
  from { opacity:0; transform:scale(0.65); }
  to   { opacity:1; transform:scale(1); }
}
.saber {
  width: 150px; height: 5px;
  border-radius: 3px;
  background: #7df9ff;
  box-shadow: 0 0 12px #7df9ff, 0 0 26px rgba(125,249,255,0.35);
  animation: pop 0.4s 0.3s both, sp2 2s 0.7s ease-in-out infinite;
}
@keyframes sp2 {
  0%,100%{ box-shadow:0 0 10px #7df9ff; }
  50%    { box-shadow:0 0 22px #7df9ff, 0 0 42px rgba(125,249,255,0.5); }
}
.cel-close {
  font-size: 13px;
  color: #7a5aaa;
  cursor: pointer;
  text-decoration: underline;
  text-underline-offset: 2px;
  animation: pop 0.4s 0.45s both;
}

.conf {
  position: fixed;
  width: 7px; height: 7px;
  border-radius: 1px;
  pointer-events: none;
  z-index: 210;
  animation: fall var(--d,2s) ease-in forwards;
}
@keyframes fall {
  0%   { opacity:1; transform:translateY(-10px) rotate(0deg); }
  100% { opacity:0; transform:translateY(100vh) rotate(540deg); }
}
</style>
</head>
<body>

  </g>

  <!-- twinkling stars -->
  <circle cx="53"  cy="68"  r="1.8" fill="#fffbe0"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.1s" repeatCount="indefinite"/></circle>
  <circle cx="288" cy="118" r="2"   fill="#fffbe0"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/></circle>

  <!-- sparkle crosses -->
  <g stroke="#fffbe0" stroke-linecap="round" stroke-width="1.2">

  <animateTransform href="#tap-hint" attributeName="transform" type="translate" values="0,0;0,-5;0,0" dur="2s" repeatCount="indefinite"/>

<!-- HTML card layer -->
<div id="scene">
  <div id="card">
    <div id="jedi-wrap">
      <img id="jedi-img" src="Image.jpeg" alt="Jedi"
        onerror="this.style.display='none';document.getElementById('jedi-fallback').style.display='flex'">
      <div id="jedi-fallback">⚔️</div>
    </div>

    <div id="paper">
      <div class="line l-name" id="l1">Mike...</div>
      <div class="line l-body" id="l2">On this May the 4th, I have something important to ask you...</div>
      <div class="line l-q" id="l3">Will you be my Jedi? </div>
      <div id="btns">
        <button class="btn btn-yes"  onclick="celebrate('yes')">Yes duh</button>
        <button class="btn btn-sure" onclick="celebrate('sure')">Of course (u have no other option btw) </button>
      </div>
    </div>
  </div>
</div>

<!-- celebration -->
<div id="cel">
  <div class="cel-title" id="ct"></div>
  <div class="saber"></div>
  <div class="cel-msg" id="cm"></div>
  <div class="cel-close" onclick="document.getElementById('cel').classList.remove('show')">← back to the stars</div>
</div>

<script>
let opened = false;

function openEnvelope() {
  if (opened) return;
  opened = true;

  const hint  = document.getElementById('tap-hint');
  const flap  = document.getElementById('flap');
  const sealC = document.getElementById('seal-c');
  const sealT = document.getElementById('seal-t');
  const envG  = document.getElementById('svg-env');

  hint.style.opacity = '0';
  hint.style.transition = 'opacity 0.3s';

  // flip flap up
  flap.setAttribute('points', '90,320 195,248 300,320');
  sealC.setAttribute('opacity', '0');
  sealT.setAttribute('opacity', '0');

  for (let i = 0; i < 9; i++) setTimeout(() => spark(), i * 90);

  setTimeout(() => {
    envG.setAttribute('opacity', '0');
    envG.style.transition = 'opacity 0.4s';

    setTimeout(() => {
      const bgSvg = document.querySelector('svg');
      bgSvg.style.opacity = '0.35';
      bgSvg.style.transition = 'opacity 0.5s';

      const card = document.getElementById('card');
      card.style.display = 'flex';

      setTimeout(() => document.getElementById('jedi-wrap').classList.add('show'), 60);
      setTimeout(() => document.getElementById('paper').classList.add('show'), 320);
      setTimeout(() => document.getElementById('l1').classList.add('show'), 650);
      setTimeout(() => document.getElementById('l2').classList.add('show'), 1060);
      setTimeout(() => document.getElementById('l3').classList.add('show'), 1480);
      setTimeout(() => {
        document.getElementById('btns').classList.add('show');
        for (let i = 0; i < 8; i++) setTimeout(() => spark(), i * 130);
      }, 1900);
    }, 420);
  }, 820);
}

function spark() {
  const glyphs = ['♡','✦','✧','⋆','·'];
  const colors = ['#f0a0c0','#c8aaee','#f5df8e','#d4b8f0','#ffd6e8','#7df9ff'];
  const el = document.createElement('div');
  el.className = 'sp';
  el.textContent = glyphs[Math.floor(Math.random() * glyphs.length)];
  el.style.color = colors[Math.floor(Math.random() * colors.length)];
  el.style.left = Math.random() * window.innerWidth + 'px';
  el.style.top  = (window.innerHeight * 0.35 + Math.random() * window.innerHeight * 0.5) + 'px';
  el.style.setProperty('--d', (Math.random() * 1.5 + 2) + 's');
  el.style.fontSize = (Math.random() * 12 + 12) + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 4000);
}

function celebrate(w) {
  const cel = document.getElementById('cel');
  document.getElementById('ct').textContent = w === 'yes'
    ? '🌟 The force grows stronger 🌟'
    : '😌 of course... the force knew all along.';
  document.getElementById('cm').textContent = w === 'yes'
    ? 'we shall be the most powerful Jedi pair in the galaxy. '
    : 'The galaxy is brighter with you in it. May the 4th be with us 💜';
  cel.classList.add('show');
  confetti();
  for (let i = 0; i < 18; i++) setTimeout(() => spark(), i * 90);
}

function confetti() {
  const cols = ['#f0a0c0','#f5df8e','#c8aaee','#7df9ff','#ff80ab','#e0c0ff'];
  for (let i = 0; i < 45; i++) {
    setTimeout(() => {
      const c = document.createElement('div');
      c.className = 'conf';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.top = '-8px';
      c.style.background = cols[Math.floor(Math.random() * cols.length)];
      c.style.setProperty('--d', (Math.random() * 1.5 + 1.5) + 's');
      c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 3500);
    }, i * 50);
  }
}

setTimeout(() => { for (let i = 0; i < 4; i++) setTimeout(() => spark(), i * 700); }, 1500);
setInterval(() => spark(), 5500);
</script>
</body>
</html>
